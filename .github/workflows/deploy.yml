# Deploy static site to GitHub Pages
#
# Pipeline: npm ci → validate → check → test → build → single Pages upload
# No double upload.  `.vega/` is gitignored and never available in CI.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source data & artifact consistency
        run: npm run validate

      - name: Run Astro check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build & upload
        uses: withastro/action@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
